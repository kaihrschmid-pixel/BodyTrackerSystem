[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "body-tracker"
version = "0.1.0"
description = "Open-source daily body tracking system — modular hardware adapters, local database, AI insights"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # Async SQLite
    "aiosqlite>=0.20",
    # HTTP client (wearable APIs, Withings)
    "httpx>=0.27",
    # Config file parsing
    "pyyaml>=6.0",
    # Web API (dashboard backend)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# Full install: image processing + pose estimation
vision = [
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
]

# BLE scale support (Xiaomi, Renpho, generic BLE)
ble = ["bleak>=0.21"]

# Raspberry Pi camera
picamera2 = ["picamera2>=0.3"]

# Intel RealSense depth camera
realsense = ["pyrealsense2>=2.55"]

# Everything for a full non-Pi install
full = [
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
    "bleak>=0.21",
]

# Development & testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
body-tracker = "core.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

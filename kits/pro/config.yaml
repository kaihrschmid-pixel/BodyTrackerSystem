# kits/pro/config.yaml
# =====================
# Pro Kit — Withings Body Scan 2 + Intel RealSense D415/D435
#
# The pro kit adds depth-map capture alongside the silhouette photo,
# enabling 3D body volume estimation and circumference approximation
# (chest, waist, hip) from the structured-light depth data.
#
# Recommended hardware (~1 200–1 600 €):
#   Scale:   Withings Body Scan 2                 (~600 €, check availability)
#            → Full BIA segmental + ECG + nerve health + enhanced bioimpedance
#            Alternatively: Withings Body Scan 1  (~400 €) — same metrics
#   Camera:  Intel RealSense D435i                (~200 €)
#            → 30 fps RGB + depth, IMU, 1280×720 depth at up to 90 fps
#            Alternative: Intel RealSense D415    (~180 €, narrower FOV)
#   Host:    Intel NUC or x86 mini-PC (4+ cores)  (~300 €)
#            RealSense requires USB 3.0; Pi 5 works but Pi 4 has USB bandwidth limits
#   Mount:   Heavy-duty tripod + RealSense mount  (~50 €)
#            → 2.5–3 m in front of scale, 1.2 m height for full-body capture
#
# Setup:
#   1. Install Intel RealSense SDK 2.0: https://github.com/IntelRealSense/librealsense
#   2. pip install body-tracker[realsense]
#   3. Complete Withings OAuth: body-tracker auth withings
#   4. body-tracker run --config kits/pro/config.yaml

profile:
  name: "Default"
  height_cm: 175          # ← update this
  sex: "male"             # "male" | "female" | "other"
  birthdate: "1990-01-01" # ← update this
  timezone: "Europe/Berlin"

hardware:
  scale:
    adapter: "withings"
    client_id: "YOUR_WITHINGS_CLIENT_ID"
    client_secret: "YOUR_WITHINGS_CLIENT_SECRET"
    access_token: ""          # populated after: body-tracker auth withings
    refresh_token: ""
    token_path: "data/withings_token.json"

  camera:
    adapter: "realsense"
    photos_path: "data/photos"
    # Resolution for the colour (RGB) stream
    resolution: [1280, 720]
    fps: 30
    stabilisation_delay_s: 4   # extra second for depth stabilisation
    # Depth preset — HIGH_ACCURACY trades range for precision
    # Options: DEFAULT, HIGH_ACCURACY, HIGH_DENSITY, MEDIUM_DENSITY
    depth_preset: "HIGH_ACCURACY"
    # Save the depth map alongside each photo (as a 16-bit PNG)
    save_depth_map: true
    # Clip far objects at this distance (metres) to reduce background noise
    depth_clip_m: 4.0
    # Enable hardware emitter (leave true for D435i, false if causing interference)
    emitter_enabled: true

storage:
  db_path: "data/tracker.db"
  photos_path: "data/photos"
  exports_path: "data/exports"

scheduler:
  daily_reminder_time: "07:30"
  timezone: "Europe/Berlin"

imaging:
  enabled: true
  segmentation_model: 1
  min_detection_confidence: 0.6   # higher threshold — better camera = better results
  output_dir: "data/silhouettes"
  # Enable depth-assisted segmentation when RealSense depth map is available
  use_depth_map: true
  depth_foreground_clip_m: 3.0    # pixels beyond this distance → background

wearables:
  # Full wearable stack example for pro users
  oura:
    enabled: false
    personal_access_token: "YOUR_TOKEN"
    # https://cloud.ouraring.com/personal-access-tokens

  garmin:
    enabled: false
    consumer_key: ""
    consumer_secret: ""
    access_token: ""
    access_token_secret: ""
    user_id: ""

  fitbit:
    enabled: false
    client_id: ""
    client_secret: ""
    token_path: "data/fitbit_token.json"

  whoop:
    enabled: false
    client_id: ""
    client_secret: ""
    token_path: "data/whoop_token.json"

ai:
  enabled: false
  provider: "anthropic"
  model: "claude-opus-4-5"
  api_key: "YOUR_ANTHROPIC_API_KEY"
  analyse_photo: true
  analyse_trends: true
  context_days: 60               # longer window for trend analysis
  # Enable depth-based circumference estimation in AI prompt
  include_depth_estimates: true

ui:
  host: "127.0.0.1"
  port: 8000

# ---------------------------------------------------------------------------
# Expected metrics from Withings Body Scan / Body Scan 2
# ---------------------------------------------------------------------------
# weight_kg, body_fat_pct, muscle_mass_kg, bone_mass_kg, water_pct
# visceral_fat_index, heart_rate_bpm, pulse_wave_velocity, vascular_age
# phase_angle, nerve_health_score, ecm_bcm_ratio
# muscle_mass_left_arm_kg, muscle_mass_right_arm_kg
# muscle_mass_left_leg_kg, muscle_mass_right_leg_kg, muscle_mass_torso_kg
#
# Additional from RealSense depth map (post-processing):
# → 3D point cloud → circumference estimates (waist, hip, chest)
# → Stored in extras["waist_cm"], extras["hip_cm"], extras["chest_cm"]
